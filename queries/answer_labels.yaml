- qid: Q02
  answer1: refused
  answer2: correct
  citations1: n/a
  citations2: ok
  note: Answer 2 lists all seven basic actions with their costs.
  stage: ranking
  diagnosis: The baseline top 3 were turn-structure rules (5.6.1 draw phase, 5.6.2 action phase, 5.4.1) that share the words Corp, turn and action. The list of basic actions (5.2.6) is mostly click symbols and short phrases, so its embedding is a weak match (rank 7). The cross-encoder reads "BASIC ACTIONS are always available to the Corp" together with the query and puts it at rank 1.
