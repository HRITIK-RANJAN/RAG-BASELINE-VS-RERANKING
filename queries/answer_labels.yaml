- qid: Q42
  answer1: refused
  answer2: refused
  citations1: n/a
  citations2: n/a
  note: A correct refusal for both.
  stage: retrieval_recall
  diagnosis: A keyword trap. The query says "diamond symbol"; the rulebook calls these cards "unique" (the symbol is a glyph). The baseline found 2.2.1, which defines the unique symbol but only points to rule 10.1.1 for the rule itself. The gold chunks (10.1.1, 10.3.1d) are not in the top 10, so the re-ranker cannot help. Over all chunks the bi-encoder ranks the best one 63rd, and even a cross-encoder over all 602 chunks only reaches 23rd (Section 10.3), so both models miss the link between "diamond" and "unique".
