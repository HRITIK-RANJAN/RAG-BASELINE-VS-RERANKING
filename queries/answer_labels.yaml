- qid: Q32
  answer1: correct
  answer2: refused
  citations1: ok
  citations2: n/a
  note: ''
  stage: ranking
  diagnosis: The answer (4.2.7b, the Runner wins) is the last line of a chunk that is mostly about other deck rules (open information, R&D definition). The cross-encoder pushed it from rank 3 to 4 and preferred a mandatory-draw example and the R&D breach order, which share the words draw, deck and R&D. A re-ranker error, made easier by a chunk where the answer is one sentence among unrelated rules (chunking).
- qid: Q34
  answer1: hallucinated
  answer2: hallucinated
  citations1: partly
  citations2: unsupported
  note: Both answers say "yes" although no passage they were given states the rule (7.4.6b is at rank 4 and 5). Answer 2's condition (access limit not reached) matches the real rule but is attributed to passages that do not say it; Answer 1 adds an overreaching claim about cards that were not previously candidates.
  stage: ranking
  diagnosis: Both top 3s are Flagship examples and general breach rules, which share many words with the query (breach, HQ, Corp's hand, access). The specific rule 7.4.6 is ranked 4 by the bi-encoder and 5 by the cross-encoder. The generation step then filled the gap with an inference instead of refusing (a generation failure on top of a ranking failure).
- qid: Q35
  answer1: refused
  answer2: correct
  citations1: n/a
  citations2: ok
  note: Answer 2 also mentions the Showing Off exception (bottom-up), which is correct and supported.
  stage: ranking
  diagnosis: The baseline top 3 were the R&D definition (4.2.7), the breach steps (7.5) and an example about objects in R&D, all on-topic but without the order of candidates. The cross-encoder moved 7.4.7 ("working down from the top of the deck") from rank 4 to rank 1, and the next two places went to its example and the Showing Off exception.
- qid: Q36
  answer1: correct
  answer2: refused
  citations1: ok
  citations2: n/a
  note: Answer 2's passage 7.3.4 says the process repeats "until there are no longer any candidates" but not what happens then, so the refusal is faithful.
  stage: ranking
  diagnosis: The re-ranker pushed the breach step list 7.5 from rank 1 to rank 9. The step list is terse ("If they cannot, skip to step 7.5.7"), while 7.3.4 and 7.4.3 talk about candidates in full sentences that match "no more cards left to choose from". A re-ranker error.
