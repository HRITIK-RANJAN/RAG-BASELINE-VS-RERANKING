- qid: Q29
  answer1: refused
  answer2: correct
  citations1: n/a
  citations2: ok
  note: Answer 2 explains how rezzing works (pay the rez cost, checkpoint, turn faceup) but not when the Corp may rez or that agendas cannot be rezzed; that is in 8.1.2a-d, which was not in its top 3.
  stage: ranking
  diagnosis: A keyword trap. The query says "flip face up" while the rule calls this "rez". The baseline top 3 matched the words install, faceup and facedown (install-and-rez, hosted facedown cards, Runner cards turned faceup). The cross-encoder moved 8.1.2e (pay the rez cost, then turn the card faceup) from rank 4 to rank 1.
