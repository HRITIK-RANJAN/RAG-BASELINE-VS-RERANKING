- qid: Q12
  answer1: refused
  answer2: refused
  citations1: n/a
  citations2: n/a
  note: A correct refusal for both, since neither top 3 contains rule 1.13.13.
  stage: retrieval_recall
  diagnosis: The gold rule 1.13.13 is not in the top 10. Its text is about a host card changing zones, and the query's words (score area, hosted, moves) match many general zone and hosting rules better. The re-ranker only reorders the 10 candidates, so it cannot help. Over all chunks the bi-encoder ranks it 20th, while a cross-encoder over all 602 chunks ranks it 1st (Section 10.3), so the miss is in the first stage.
