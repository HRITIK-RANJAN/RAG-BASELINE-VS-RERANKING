- qid: Q18
  answer1: refused
  answer2: refused
  citations1: n/a
  citations2: n/a
  note: A correct refusal for both, since the golden rule 1.2.2 is at rank 6 in both lists.
  stage: ranking
  diagnosis: The answer is one line in the Golden Rules chunk (1.2.1-1.2.4), which also covers card text vs. rules and "if able". The baseline preferred rules about players' choices and costs; the cross-encoder preferred the rules on "must" (9.12.3) and replacement effects, which share the word "must" with the query. Neither model ranked the short general rule above these more specific ones.
