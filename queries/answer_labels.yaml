- qid: Q23
  answer1: correct
  answer2: refused
  citations1: ok
  citations2: n/a
  note: Answer 2's passages included 3.8.4 "There is no limit to the number of hardware", a misleading passage; the model refused instead of answering "yes".
  stage: ranking
  diagnosis: The re-ranker pushed the console rule 3.8.5 from rank 1 to rank 7. It preferred an Aggressive Secretary example about two installed programs being trashed, a rule about installing more than one card, and the general hardware rules. These match the words "two", "installed" and "at the same time" but not the console limit. A re-ranker error, so Answer 2 is worse.
